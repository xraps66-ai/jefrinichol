<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Scan FULL</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #0a0f1c;
  color: #00eaff;
}

video, canvas {
  position: absolute;
  top: 0;
  left: 0;
}

.hud {
  position: absolute;
  right: 20px;
  top: 30%;
  border: 1px solid #00eaff;
  padding: 12px;
  box-shadow: 0 0 20px #00eaff;
  background: rgba(0,0,0,0.4);
  font-size: 12px;
}

.scan {
  position: absolute;
  width: 100%;
  height: 3px;
  background: rgba(0,255,255,0.4);
  animation: scan 2s linear infinite;
}

@keyframes scan {
  0% { top: 0 }
  100% { top: 100% }
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="hud">
  CAMERA MODE / 02 <br>
  SUBJECT DETECTION <br>
  HAND TRACK ACTIVE
</div>

<div class="scan"></div>

<script type="module">
import {
  FilesetResolver,
  FaceDetector,
  HandLandmarker,
  DrawingUtils
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

async function cam() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  return new Promise(r => video.onloadedmetadata = r);
}

async function main() {
  await cam();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
  );

  // FACE
  const face = await FaceDetector.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/face_detector/face_detector/float16/1/face_detector.task"
    },
    runningMode: "VIDEO"
  });

  // HAND
  const hand = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
    },
    runningMode: "VIDEO",
    numHands: 2
  });

  const draw = new DrawingUtils(ctx);

  function cyberBox(x,y,w,h){
    ctx.save();
    ctx.translate(x+w/2,y+h/2);
    ctx.rotate(-0.2);

    ctx.strokeStyle="#00eaff";
    ctx.lineWidth=3;
    ctx.shadowColor="#00eaff";
    ctx.shadowBlur=15;

    ctx.strokeRect(-w/2,-h/2,w,h);

    ctx.restore();
  }

  async function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    const now = performance.now();

    // FACE
    const f = face.detectForVideo(video, now);
    f.detections.forEach(d=>{
      const b = d.boundingBox;
      cyberBox(b.originX,b.originY,b.width,b.height);
    });

    // HAND (INI GARISNYA 🔥)
    const h = hand.detectForVideo(video, now);

    if (h.landmarks) {
      for (const landmarks of h.landmarks) {
        draw.drawConnectors(
          landmarks,
          HandLandmarker.HAND_CONNECTIONS,
          { color: "#00eaff", lineWidth: 2 }
        );

        draw.drawLandmarks(landmarks, {
          color: "#00eaff",
          radius: 2
        });
      }
    }

    requestAnimationFrame(loop);
  }

  loop();
}

main();
</script>

</body>
</html>
