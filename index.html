<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Jepri Nikol</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0612;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      color: #f0e6ff;
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      /* transform: scaleX(-1);  ← sudah dihapus */
    }
    #status {
      position: absolute;
      top: 14px; left: 14px;
      background: rgba(20, 8, 30, 0.75);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #e0aaff;
      z-index: 20;
      border: 1px solid rgba(180, 80, 255, 0.4);
      text-shadow: 0 0 8px rgba(180, 80, 255, 0.6);
    }
    #fps {
      position: absolute;
      top: 14px; right: 14px;
      background: rgba(20, 8, 30, 0.65);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #c9a0e8;
      z-index: 20;
    }
    #panel {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 6, 28, 0.85);
      padding: 8px 12px;
      border-radius: 10px;
      display: flex;
      gap: 8px;
      z-index: 30;
      border: 1px solid rgba(180, 80, 255, 0.35);
      backdrop-filter: blur(10px);
    }
    button {
      background: rgba(140, 50, 220, 0.15);
      border: 1px solid rgba(180, 80, 255, 0.45);
      color: #e0aaff;
      padding: 5px 16px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
      min-width: 110px;
      height: 28px;
      line-height: 1;
    }
    button:hover {
      background: rgba(160, 70, 240, 0.3);
    }
    button.active {
      background: linear-gradient(90deg, #a855f7, #c026d3);
      color: #fff;
      font-weight: 600;
      border-color: #d946ef;
      box-shadow: 0 0 12px rgba(180, 80, 255, 0.5);
    }
  </style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="status">Project Jepri Nikol</div>
<div id="fps">FPS: --</div>

<div id="panel">
  <button id="btn1">jepri nikol 1</button>
  <button id="btn2" class="active">jepri nikol 2</button>
  <button id="btn3">jepri nikol 3</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const fpsEl = document.getElementById("fps");

const btn1 = document.getElementById("btn1");
const btn2 = document.getElementById("btn2");
const btn3 = document.getElementById("btn3");

let currentMode = "blur";
let smoothPoints = {};
let frameCount = 0;
let lastTime = performance.now();
const smoothFactor = 0.18;
const PASSWORD = "1";

function changeMode(mode, button) {
  const input = prompt("Masukkan password untuk ganti mode:");
  if (input === PASSWORD) {
    currentMode = mode;
    btn1.classList.remove("active");
    btn2.classList.remove("active");
    btn3.classList.remove("active");
    button.classList.add("active");
  } else {
    alert("Password salah!");
  }
}

btn1.onclick = () => changeMode("neon", btn1);
btn2.onclick = () => changeMode("blur", btn2);
btn3.onclick = () => changeMode("invert", btn3);

function getSmoothed(id, x, y) {
  if (!smoothPoints[id]) smoothPoints[id] = { x, y };
  else {
    smoothPoints[id].x += (x - smoothPoints[id].x) * smoothFactor;
    smoothPoints[id].y += (y - smoothPoints[id].y) * smoothFactor;
  }
  return smoothPoints[id];
}

function drawShape(hands) {
  if (hands.length < 2) return;

  let a = hands[0];
  let b = hands[1];
  if (a[0].x > b[0].x) [a, b] = [b, a];

  const w = canvas.width;
  const h = canvas.height;

  const pts = [
    getSmoothed("a4", a[4].x * w, a[4].y * h),
    getSmoothed("a8", a[8].x * w, a[8].y * h),
    getSmoothed("b8", b[8].x * w, b[8].y * h),
    getSmoothed("b4", b[4].x * w, b[4].y * h)
  ];

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  ctx.lineTo(pts[1].x, pts[1].y);
  ctx.lineTo(pts[2].x, pts[2].y);
  ctx.lineTo(pts[3].x, pts[3].y);
  ctx.closePath();
  ctx.clip();

  if (currentMode === "neon") {
    ctx.filter = "invert(1) hue-rotate(90deg) saturate(2.8) contrast(1.35) brightness(1.15)";
    ctx.drawImage(video, 0, 0, w, h);
  } else if (currentMode === "blur") {
    ctx.filter = "blur(18px) brightness(0.9)";
    ctx.drawImage(video, 0, 0, w, h);
  } else if (currentMode === "invert") {
    ctx.filter = "invert(1)";
    ctx.drawImage(video, 0, 0, w, h);
  }

  ctx.filter = "none";
  ctx.restore();
}

function onResults(results) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

  const hands = results.multiHandLandmarks || [];

  if (hands.length >= 2) {
    const modeName = currentMode === "blur" ? "jepri nikol 2" : 
                     currentMode === "neon" ? "jepri nikol 1" : "jepri nikol 3";
    statusEl.textContent = `Project Jepri Nikol • ${modeName}`;
    drawShape(hands);
  } else if (hands.length === 1) {
    statusEl.textContent = "Project Jepri Nikol • 1 Tangan";
  } else {
    statusEl.textContent = "Project Jepri Nikol";
    smoothPoints = {};
  }

  frameCount++;
  const now = performance.now();
  if (now - lastTime > 1000) {
    fpsEl.textContent = `FPS: ${frameCount}`;
    frameCount = 0;
    lastTime = now;
  }
}

async function start() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 1280 },
        height: { ideal: 720 }
      },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.5
    });

    hands.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: canvas.width,
      height: canvas.height
    });

    await camera.start();

  } catch (err) {
    statusEl.textContent = "Error: " + err.message;
    console.error(err);
  }
}

start();
</script>
</body>
</html>
