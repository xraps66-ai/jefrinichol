<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manual Tracking - Invert Mode</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0f7ff;
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #status {
      position: absolute;
      top: 18px; left: 18px;
      background: rgba(0,0,0,0.55);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #0ff;
      text-shadow: 0 0 8px #0ff;
      z-index: 20;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(0,255,255,0.25);
    }
    #fps {
      position: absolute;
      top: 18px; right: 18px;
      background: rgba(0,0,0,0.55);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #aaa;
      z-index: 20;
    }
  </style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="status">Menunggu tangan...</div>
<div id="fps">FPS: --</div>

<script type="module">
import {
  FilesetResolver,
  HandLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const fpsEl = document.getElementById("fps");

let handLandmarker = null;
let lastLandmarks = null;
let smoothPoints = {};
let glitchTimer = 0;
let prevHandCount = 0;
let frameCount = 0;
let lastFpsTime = performance.now();

async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await new Promise(r => {
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      r();
    };
  });
}

function getSmoothed(id, x, y, alpha = 0.32) {
  if (!smoothPoints[id]) smoothPoints[id] = { x, y };
  else {
    smoothPoints[id].x += (x - smoothPoints[id].x) * alpha;
    smoothPoints[id].y += (y - smoothPoints[id].y) * alpha;
  }
  return smoothPoints[id];
}

function drawDualHandShape(landmarksList) {
  if (landmarksList.length < 2) return;

  let handA = landmarksList[0];
  let handB = landmarksList[1];

  // Urutkan kiri - kanan
  if (handA[0].x > handB[0].x) {
    [handA, handB] = [handB, handA];
  }

  const points = [
    getSmoothed("a4", handA[4].x * canvas.width, handA[4].y * canvas.height), // jempol kiri
    getSmoothed("a8", handA[8].x * canvas.width, handA[8].y * canvas.height), // telunjuk kiri
    getSmoothed("b8", handB[8].x * canvas.width, handB[8].y * canvas.height), // telunjuk kanan
    getSmoothed("b4", handB[4].x * canvas.width, handB[4].y * canvas.height)  // jempol kanan
  ];

  // ===== INVERT AREA =====
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  ctx.lineTo(points[1].x, points[1].y);
  ctx.lineTo(points[2].x, points[2].y);
  ctx.lineTo(points[3].x, points[3].y);
  ctx.closePath();
  ctx.clip();

  // Gambar kamera dengan filter invert
  ctx.filter = "invert(1) hue-rotate(180deg)";
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  ctx.filter = "none";

  ctx.restore();

  // ===== BORDER NEON =====
  ctx.save();
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = "#ffffff";
  ctx.shadowColor = "#00ffff";
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  ctx.lineTo(points[1].x, points[1].y);
  ctx.lineTo(points[2].x, points[2].y);
  ctx.lineTo(points[3].x, points[3].y);
  ctx.closePath();
  ctx.stroke();

  // Garis silang
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = "rgba(255,255,255,0.4)";
  ctx.shadowBlur = 0;
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  ctx.lineTo(points[2].x, points[2].y);
  ctx.moveTo(points[1].x, points[1].y);
  ctx.lineTo(points[3].x, points[3].y);
  ctx.stroke();
  ctx.restore();

  // Titik di ujung
  points.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "#00ffff";
    ctx.shadowBlur = 10;
    ctx.fill();
  });
}

function updateFps() {
  frameCount++;
  const now = performance.now();
  if (now - lastFpsTime >= 1000) {
    fpsEl.textContent = `FPS: ${frameCount}`;
    frameCount = 0;
    lastFpsTime = now;
  }
}

async function main() {
  await setupCamera();

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.6,
    minTrackingConfidence: 0.55
  });

  function loop() {
    if (video.readyState >= 2) {
      const result = handLandmarker.detectForVideo(video, performance.now());
      lastLandmarks = result.landmarks?.length > 0 ? result.landmarks : null;
    }

    // Latar kamera normal
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const count = lastLandmarks ? lastLandmarks.length : 0;

    if (count >= 2) {
      statusEl.textContent = "2 Tangan - Invert Aktif";
      drawDualHandShape(lastLandmarks);
      if (count > prevHandCount) glitchTimer = 8;
    } else if (count === 1) {
      statusEl.textContent = "1 Tangan - Butuh 2 tangan";
    } else {
      statusEl.textContent = "Menunggu tangan...";
      smoothPoints = {};
    }

    prevHandCount = count;
    updateFps();
    requestAnimationFrame(loop);
  }

  loop();
}

main().catch(err => {
  console.error(err);
  statusEl.textContent = "Error: " + err.message;
});
</script>
</body>
</html>
