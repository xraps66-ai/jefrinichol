<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manual Tracking Lite - Fast Load</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #050508;
      overflow: hidden;
      font-family: system-ui, -apple-system, sans-serif;
      color: #e0f7ff;
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #loading {
      position: fixed;
      inset: 0;
      background: #030307;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
    .loader {
      width: 42px; height: 42px;
      border: 3px solid rgba(0,255,255,0.15);
      border-top-color: #0ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status {
      position: absolute;
      top: 14px; left: 14px;
      background: rgba(0,0,0,0.6);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #0ff;
      z-index: 20;
      border: 1px solid rgba(0,255,255,0.25);
    }
    #fps {
      position: absolute;
      top: 14px; right: 14px;
      background: rgba(0,0,0,0.5);
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: #9ab;
      z-index: 20;
    }
    #toggle {
      position: absolute;
      top: 55px; right: 14px;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(0,255,255,0.35);
      color: #0ff;
      font-size: 18px;
      cursor: pointer;
      z-index: 30;
    }
    #panel {
      position: absolute;
      top: 55px; right: 14px;
      width: 260px;
      background: rgba(8,10,16,0.95);
      border: 1px solid rgba(0,255,255,0.25);
      border-radius: 12px;
      padding: 14px;
      z-index: 25;
      backdrop-filter: blur(10px);
      transition: 0.3s;
    }
    #panel.hidden { transform: translateX(120%); opacity: 0; pointer-events: none; }
    #panel h3 { font-size: 13px; color: #0ff; margin-bottom: 12px; }
    label { font-size: 12px; color: #8ab; display: block; margin: 8px 0 4px; }
    select, input[type=range] { width: 100%; margin-bottom: 6px; }
    select {
      background: #111; color: #fff;
      border: 1px solid #333; padding: 6px; border-radius: 5px;
    }
    .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    button {
      background: rgba(0,255,255,0.1);
      border: 1px solid rgba(0,255,255,0.3);
      color: #0ff; padding: 6px 10px;
      border-radius: 5px; font-size: 12px; cursor: pointer;
    }
    button.active { background: #0ff; color: #000; font-weight: 600; }
    .hint { font-size: 11px; color: #678; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>

<div id="loading">
  <div class="loader"></div>
  <p style="margin-top:14px;color:#0ff;font-size:13px;" id="loadText">Memuat...</p>
</div>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<div id="status">Menunggu tangan...</div>
<div id="fps">FPS: --</div>
<button id="toggle">☰</button>

<div id="panel" class="hidden">
  <h3>Control Panel</h3>

  <label>Mode Efek</label>
  <select id="mode">
    <option value="invert">Invert Warna</option>
    <option value="invertHue">Invert + Hue</option>
    <option value="neon">Neon</option>
  </select>

  <label>Opacity <span id="opVal">0.85</span></label>
  <input type="range" id="opacity" min="0.3" max="1" step="0.05" value="0.85">

  <label>Smoothing <span id="smVal">0.28</span></label>
  <input type="range" id="smooth" min="0.1" max="0.5" step="0.02" value="0.28">

  <div class="btns">
    <button id="btnCross" class="active">Garis</button>
    <button id="btnDots" class="active">Titik</button>
    <button id="btnDebug">Debug</button>
  </div>

  <div class="btns" style="margin-top:8px;">
    <button id="btnShot">Screenshot</button>
    <button id="btnFull">Fullscreen</button>
  </div>

  <div class="hint">
    H = Panel | S = Screenshot<br>
    Pakai 2 tangan (jempol + telunjuk)
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusEl = document.getElementById("status");
const fpsEl = document.getElementById("fps");
const loading = document.getElementById("loading");
const loadText = document.getElementById("loadText");
const panel = document.getElementById("panel");
const toggle = document.getElementById("toggle");

let smoothPoints = {};
let lastResults = null;
let prevCount = 0;
let frameCount = 0;
let lastTime = performance.now();

// Settings
let mode = "invert";
let opacity = 0.85;
let smooth = 0.28;
let showCross = true;
let showDots = true;
let debug = false;

// UI Events
document.getElementById("mode").onchange = e => mode = e.target.value;
document.getElementById("opacity").oninput = e => {
  opacity = parseFloat(e.target.value);
  document.getElementById("opVal").textContent = opacity;
};
document.getElementById("smooth").oninput = e => {
  smooth = parseFloat(e.target.value);
  document.getElementById("smVal").textContent = smooth;
};
document.getElementById("btnCross").onclick = function() {
  showCross = !showCross;
  this.classList.toggle("active", showCross);
};
document.getElementById("btnDots").onclick = function() {
  showDots = !showDots;
  this.classList.toggle("active", showDots);
};
document.getElementById("btnDebug").onclick = function() {
  debug = !debug;
  this.classList.toggle("active", debug);
};
document.getElementById("btnShot").onclick = () => {
  const a = document.createElement("a");
  a.download = `hand-${Date.now()}.png`;
  a.href = canvas.toDataURL();
  a.click();
};
document.getElementById("btnFull").onclick = () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
};
toggle.onclick = () => panel.classList.toggle("hidden");

window.addEventListener("keydown", e => {
  if (e.key === "h" || e.key === "H") panel.classList.toggle("hidden");
  if (e.key === "s" || e.key === "S") document.getElementById("btnShot").click();
});

function getSmoothed(id, x, y) {
  if (!smoothPoints[id]) smoothPoints[id] = {x, y};
  else {
    smoothPoints[id].x += (x - smoothPoints[id].x) * smooth;
    smoothPoints[id].y += (y - smoothPoints[id].y) * smooth;
  }
  return smoothPoints[id];
}

function drawShape(hands) {
  if (hands.length < 2) return;

  let a = hands[0];
  let b = hands[1];
  if (a[0].x > b[0].x) [a, b] = [b, a];

  const pts = [
    getSmoothed("a4", a[4].x * canvas.width, a[4].y * canvas.height),
    getSmoothed("a8", a[8].x * canvas.width, a[8].y * canvas.height),
    getSmoothed("b8", b[8].x * canvas.width, b[8].y * canvas.height),
    getSmoothed("b4", b[4].x * canvas.width, b[4].y * canvas.height)
  ];

  // Clip + effect
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  ctx.lineTo(pts[1].x, pts[1].y);
  ctx.lineTo(pts[2].x, pts[2].y);
  ctx.lineTo(pts[3].x, pts[3].y);
  ctx.closePath();
  ctx.clip();

  if (mode === "invert") {
    ctx.filter = "invert(1)";
    ctx.globalAlpha = opacity;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  } else if (mode === "invertHue") {
    ctx.filter = "invert(1) hue-rotate(180deg)";
    ctx.globalAlpha = opacity;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  } else {
    ctx.globalAlpha = opacity;
    ctx.fillStyle = "#00ffff";
    ctx.fill();
  }
  ctx.filter = "none";
  ctx.globalAlpha = 1;
  ctx.restore();

  // Border
  ctx.lineWidth = 3.2;
  ctx.strokeStyle = "#fff";
  ctx.shadowColor = "#0ff";
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  ctx.lineTo(pts[1].x, pts[1].y);
  ctx.lineTo(pts[2].x, pts[2].y);
  ctx.lineTo(pts[3].x, pts[3].y);
  ctx.closePath();
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Cross
  if (showCross) {
    ctx.lineWidth = 1.3;
    ctx.strokeStyle = "rgba(255,255,255,0.4)";
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    ctx.lineTo(pts[2].x, pts[2].y);
    ctx.moveTo(pts[1].x, pts[1].y);
    ctx.lineTo(pts[3].x, pts[3].y);
    ctx.stroke();
  }

  // Dots
  if (showDots) {
    pts.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();
    });
  }
}

function onResults(results) {
  lastResults = results;

  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

  const hands = results.multiHandLandmarks || [];
  const count = hands.length;

  if (count >= 2) {
    statusEl.textContent = "2 Tangan • Aktif";
    drawShape(hands);
  } else if (count === 1) {
    statusEl.textContent = "1 Tangan • Butuh 2";
  } else {
    statusEl.textContent = "Menunggu tangan...";
    smoothPoints = {};
  }

  if (debug && hands.length) {
    for (const hand of hands) {
      for (let i = 0; i < hand.length; i++) {
        const x = hand[i].x * canvas.width;
        const y = hand[i].y * canvas.height;
        ctx.beginPath();
        ctx.arc(x, y, 2.5, 0, Math.PI*2);
        ctx.fillStyle = (i===4 || i===8) ? "#ff0" : "#0f0";
        ctx.fill();
      }
    }
  }

  ctx.restore();

  // FPS
  frameCount++;
  const now = performance.now();
  if (now - lastTime > 1000) {
    fpsEl.textContent = `FPS: ${frameCount}`;
    frameCount = 0;
    lastTime = now;
  }
}

async function start() {
  try {
    loadText.textContent = "Menyiapkan kamera...";

    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: 1280, height: 720 },
      audio: false
    });
    video.srcObject = stream;
    await video.play();

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    loadText.textContent = "Memuat Hands model...";

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 0,        // 0 = lebih ringan & cepat
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.55
    });

    hands.onResults(onResults);

    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({ image: video });
      },
      width: 1280,
      height: 720
    });

    await camera.start();

    loading.classList.add("hide");
    setTimeout(() => loading.style.display = "none", 500);

  } catch (err) {
    loadText.textContent = "Error: " + err.message;
    console.error(err);
  }
}

start();
</script>
</body>
</html>
