<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cyber Scan Camera</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #0a0f1c;
  font-family: 'Segoe UI', sans-serif;
  color: #00eaff;
}

video, canvas {
  position: absolute;
  top: 0;
  left: 0;
}

.hud-box {
  position: absolute;
  right: 20px;
  top: 30%;
  padding: 15px;
  border: 1px solid #00eaff;
  box-shadow: 0 0 20px #00eaff;
  background: rgba(0,0,0,0.4);
  font-size: 12px;
}

.hud-box b {
  display: block;
  margin-bottom: 5px;
}

.scan-line {
  position: absolute;
  width: 100%;
  height: 3px;
  background: rgba(0,255,255,0.4);
  animation: scan 2s linear infinite;
}

@keyframes scan {
  0% { top: 0; }
  100% { top: 100%; }
}

/* efek glitch */
.glitch {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(
    rgba(0,255,255,0.05) 50%,
    transparent 50%
  );
  background-size: 100% 4px;
  pointer-events: none;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div class="hud-box">
  <b>CAMERA MODE / 02</b>
  SUBJECT DETECTION<br>
  HAND FRAME ACTIVE
</div>

<div class="scan-line"></div>
<div class="glitch"></div>

<script type="module">
import {
  FaceDetector,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

async function startCam() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: true });
  video.srcObject = stream;
  return new Promise(res => video.onloadedmetadata = res);
}

async function run() {
  await startCam();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/wasm"
  );

  const detector = await FaceDetector.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/face_detector/face_detector/float16/1/face_detector.task"
    },
    runningMode: "VIDEO"
  });

  function drawCyberBox(x, y, w, h) {
    ctx.save();

    // ROTATE biar miring kayak TikTok
    ctx.translate(x + w/2, y + h/2);
    ctx.rotate(-0.2);

    ctx.strokeStyle = "#00eaff";
    ctx.lineWidth = 3;
    ctx.shadowColor = "#00eaff";
    ctx.shadowBlur = 15;

    ctx.strokeRect(-w/2, -h/2, w, h);

    ctx.fillStyle = "#00eaff";
    ctx.font = "12px monospace";
    ctx.fillText("CYBER FRAME ACTIVE", -w/2, -h/2 - 10);

    ctx.restore();
  }

  async function detect() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const res = detector.detectForVideo(video, performance.now());

    res.detections.forEach(d => {
      const b = d.boundingBox;
      drawCyberBox(b.originX, b.originY, b.width, b.height);
    });

    requestAnimationFrame(detect);
  }

  detect();
}

run();
</script>

</body>
</html>
