<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manual Tracking - Dual Hand Shape</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    video, canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    #status {
      position: absolute;
      top: 20px; left: 20px;
      color: #0ff;
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 0 10px #0ff;
      z-index: 10;
      pointer-events: none;
    }
  </style>
</head>
<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="status">Menunggu tangan...</div>

<script type="module">
import {
  FilesetResolver,
  HandLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");

let handLandmarker = null;
let lastLandmarks = null;
let smoothPoints = {};
let glitchTimer = 0;
let prevHandCount = 0;

async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } },
    audio: false
  });
  video.srcObject = stream;
  await new Promise(r => {
    video.onloadedmetadata = () => {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      r();
    };
  });
}

function getSmoothed(id, x, y, alpha = 0.32) {
  if (!smoothPoints[id]) smoothPoints[id] = { x, y };
  else {
    smoothPoints[id].x += (x - smoothPoints[id].x) * alpha;
    smoothPoints[id].y += (y - smoothPoints[id].y) * alpha;
  }
  return smoothPoints[id];
}

function drawDualHandShape(landmarksList) {
  if (landmarksList.length < 2) return;

  // Ambil jempol (4) dan telunjuk (8) dari kedua tangan
  let handA = landmarksList[0];
  let handB = landmarksList[1];

  // Pastikan urutan kiri-kanan biar bentuk tidak silang
  if (handA[0].x > handB[0].x) {
    [handA, handB] = [handB, handA];
  }

  const points = [
    getSmoothed("a4", handA[4].x * canvas.width, handA[4].y * canvas.height), // jempol kiri
    getSmoothed("a8", handA[8].x * canvas.width, handA[8].y * canvas.height), // telunjuk kiri
    getSmoothed("b8", handB[8].x * canvas.width, handB[8].y * canvas.height), // telunjuk kanan
    getSmoothed("b4", handB[4].x * canvas.width, handB[4].y * canvas.height), // jempol kanan
  ];

  // ===== Gradient rainbow (mirip video) =====
  const gradient = ctx.createLinearGradient(
    points[0].x, points[0].y,
    points[2].x, points[2].y
  );
  gradient.addColorStop(0.0, "#ffcc00");   // kuning
  gradient.addColorStop(0.25, "#ff5500");  // oranye
  gradient.addColorStop(0.5,  "#00ffcc");  // cyan
  gradient.addColorStop(0.75, "#ff00aa");  // magenta
  gradient.addColorStop(1.0,  "#aa00ff");  // ungu

  ctx.save();

  // Isi bentuk
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  ctx.lineTo(points[1].x, points[1].y);
  ctx.lineTo(points[2].x, points[2].y);
  ctx.lineTo(points[3].x, points[3].y);
  ctx.closePath();

  ctx.globalAlpha = 0.72;
  ctx.fillStyle = gradient;
  ctx.fill();

  // Border putih + glow
  ctx.globalAlpha = 1;
  ctx.lineWidth = 3.5;
  ctx.strokeStyle = "#ffffff";
  ctx.shadowColor = "#00ffff";
  ctx.shadowBlur = 18;
  ctx.stroke();

  // Garis silang di dalam (biar lebih 3D)
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);
  ctx.lineTo(points[2].x, points[2].y);
  ctx.moveTo(points[1].x, points[1].y);
  ctx.lineTo(points[3].x, points[3].y);
  ctx.stroke();

  ctx.restore();

  // Titik di setiap ujung
  points.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5.5, 0, Math.PI * 2);
    ctx.fillStyle = "#fff";
    ctx.shadowColor = "#ff00aa";
    ctx.shadowBlur = 12;
    ctx.fill();
  });
}

async function main() {
  await setupCamera();

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2,
    minHandDetectionConfidence: 0.6,
    minTrackingConfidence: 0.55
  });

  function loop() {
    if (video.readyState >= 2) {
      const result = handLandmarker.detectForVideo(video, performance.now());
      lastLandmarks = result.landmarks?.length > 0 ? result.landmarks : null;
    }

    // Latar kamera normal
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const count = lastLandmarks ? lastLandmarks.length : 0;

    if (count >= 2) {
      status.textContent = "2 Tangan terdeteksi - Bentuk aktif";
      drawDualHandShape(lastLandmarks);

      if (count > prevHandCount) glitchTimer = 8;
    } else if (count === 1) {
      status.textContent = "1 Tangan - Butuh 2 tangan untuk bentuk";
    } else {
      status.textContent = "Menunggu tangan...";
      smoothPoints = {};
    }

    prevHandCount = count;

    // Glitch tipis
    if (glitchTimer > 0) {
      for (let i = 0; i < 6; i++) {
        ctx.fillStyle = `rgba(255, ${80 + Math.random()*175}, 255, 0.12)`;
        ctx.fillRect(
          Math.random() * canvas.width,
          Math.random() * canvas.height,
          Math.random() * 90 + 20,
          Math.random() * 10 + 2
        );
      }
      glitchTimer--;
    }

    requestAnimationFrame(loop);
  }
  loop();
}

main().catch(err => {
  console.error(err);
  status.textContent = "Error: " + err.message;
});
</script>
</body>
</html>
